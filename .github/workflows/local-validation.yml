name: Local release validation

on:
  push:
    branches: ['build/local-minimize-on-dock-click']

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Repository checks
        run: |
          python3 Scripts/check_localization.py
          python3 Scripts/check_debug_switches.py
      # The full suite passed in run 41592864823. Only this packaging workflow changed.
      - name: Confirm source matches the tested commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          git fetch --depth=1 origin f0455a08b76f631925c7ad05feca9707806f9577
          git diff --exit-code f0455a08b76f631925c7ad05feca9707806f9577 HEAD \
            -- . ':(exclude).github/workflows/local-validation.yml'
      - name: Release build
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
            -project macos-dock-cc-v2.xcodeproj \
            -scheme macos-dock-cc-v2 \
            -configuration Release \
            -derivedDataPath build/ReleaseDerivedData \
            ARCHS='x86_64 arm64' ONLY_ACTIVE_ARCH=NO \
            CLANG_COVERAGE_MAPPING=NO CODE_SIGNING_ALLOWED=NO \
            >build/release.log 2>&1 || { tail -n 120 build/release.log; exit 1; }
          python3 Scripts/check_availability_warnings.py build/release.log
          APP='build/ReleaseDerivedData/Build/Products/Release/macos-dock-cc-v2.app'
          cp LICENSE "$APP/Contents/Resources/LICENSE"
          source Scripts/lib/release_binary.sh
          strip_release_binary "$APP/Contents/MacOS/macos-dock-cc-v2"
          verify_release_binary "$APP/Contents/MacOS/macos-dock-cc-v2"
          ditto -c -k --keepParent "$APP" build/local-release.zip
      - name: Upload local build
        uses: actions/upload-artifact@v4
        with:
          name: local-release
          path: build/local-release.zip
          retention-days: 3
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          path: build/*.log
          retention-days: 3
